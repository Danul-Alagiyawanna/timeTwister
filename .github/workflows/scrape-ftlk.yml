name: Scrape FT.lk (incremental)

on:
  # Run every 30 minutes around the clock
  schedule:
    - cron: "*/30 * * * *"

  # Allows manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "incremental"
        type: choice
        options:
          - incremental
          - date-range
      start_date:
        description: "Start date (YYYY-MM-DD) — only used when mode=date-range"
        required: false
        default: ""
      end_date:
        description: "End date (YYYY-MM-DD) — only used when mode=date-range"
        required: false
        default: ""

env:
  PYTHON_VERSION: "3.11"
  DATA_FILE: timeTwister/data/ftlk_latest_news.json
  CHECKPOINT_FILE: timeTwister/data/ftlk_latest_news_checkpoint.json

jobs:
  scrape:
    name: FT.lk scraper
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 so we can push back the updated JSON
          fetch-depth: 0

      # ── 2. Restore cached data files (checkpoint + latest articles) ──────────
      - name: Restore data cache
        id: cache-data
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DATA_FILE }}
            ${{ env.CHECKPOINT_FILE }}
          # Cache key rotates daily; restore-keys fall back to any same-day key
          key: ftlk-data-${{ runner.os }}-${{ hashFiles(env.CHECKPOINT_FILE) }}
          restore-keys: |
            ftlk-data-${{ runner.os }}-

      # ── 3. Python ────────────────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: timeTwister/requirements.txt

      - name: Install Python dependencies
        run: pip install -r timeTwister/requirements.txt

      # ── 4. Chrome ────────────────────────────────────────────────────────────
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          # pin to a known-good version; bump if chromedriver breaks
          chrome-version: stable

      # ── 5. Run scraper ───────────────────────────────────────────────────────
      - name: Run incremental scrape
        if: ${{ github.event.inputs.mode != 'date-range' }}
        working-directory: timeTwister
        env:
          SCRAPE_MODE: incremental
        run: python scrapers/ftlk_selenium_json.py --incremental

      - name: Run date-range scrape
        if: ${{ github.event.inputs.mode == 'date-range' }}
        working-directory: timeTwister
        run: |
          python scrapers/ftlk_selenium_json.py \
            "${{ github.event.inputs.start_date }}" \
            "${{ github.event.inputs.end_date }}"

      # ── 6. Upload artifact (always, even if scraper found nothing new) ────────
      - name: Upload data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftlk-data-${{ github.run_id }}
          path: |
            ${{ env.DATA_FILE }}
            ${{ env.CHECKPOINT_FILE }}
          retention-days: 7

      # ── 7. Commit & push updated JSON back to the repo ───────────────────────
      #    Only runs when new articles were actually written (file changed).
      #    Remove this step if you'd rather store data in Supabase/S3 instead.
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.DATA_FILE }}" "${{ env.CHECKPOINT_FILE }}" || true
          if git diff --cached --quiet; then
            echo "No new articles — nothing to commit."
          else
            git commit -m "chore: FT.lk incremental scrape $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
