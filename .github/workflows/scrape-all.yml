# Run all TimeTwister scrapers (matrix).
# incremental=true → FT.lk-style (--incremental, checkpoint, replace JSON only)
# incremental=false → date-range (yesterday–today) + xvfb on CI

name: Scrape all news outlets

# Avoid stacking 15+15 runners if a run is still in progress
concurrency:
  group: scrape-all
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      scraper:
        description: "Which scraper to run (all = full matrix)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - sundaytimes
          - dailynews
          - ceylontoday
          - dailymirror
          - ftlk
          - economynext
          - morning
          - sundayobserver
          - divaina
          - lankadeepa
          - aruna
          - mawbima
          - virakesari
          - thinakaran
          - thamilan
  schedule:
    - cron: "0 6,18 * * *"

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: write

jobs:
  # matrix.* is not allowed on job-level if: — filter outlets here instead
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.filter.outputs.include }}
    steps:
      - id: filter
        uses: actions/github-script@v7
        with:
          script: |
            const all = [
              { id: 'sundaytimes', module: 'sundaytimes_selenium_json', data_file: 'sundaytimes_latest_news.json', incremental: true },
              { id: 'dailynews', module: 'dailynews_selenium_json', data_file: 'dailynews_latest_news.json', incremental: true },
              { id: 'ceylontoday', module: 'ceylontoday_selenium_json', data_file: 'ceylontoday_finance.json', incremental: true },
              { id: 'dailymirror', module: 'dailymirror_selenium_json', data_file: 'dailymirror_latest_news.json', incremental: true },
              { id: 'ftlk', module: 'ftlk_selenium_json', data_file: 'ftlk_latest_news.json', incremental: true },
              { id: 'economynext', module: 'economynext_selenium_json', data_file: 'economynext_latest_news.json', incremental: true },
              { id: 'morning', module: 'themorning_selenium_json', data_file: 'themorning_latest_news.json', incremental: true },
              { id: 'sundayobserver', module: 'sundayobserver_selenium_json', data_file: 'sundayobserver_latest_news.json', incremental: true },
              { id: 'divaina', module: 'divaina_selenium_json', data_file: 'divaina_latest_news.json', incremental: true },
              { id: 'lankadeepa', module: 'lankadeepa_selenium_json', data_file: 'lankadeepa_latest_news.json', incremental: true },
              { id: 'aruna', module: 'aruna_selenium_json', data_file: 'aruna_latest_news.json', incremental: true },
              { id: 'mawbima', module: 'mawbima_selenium_json', data_file: 'mawbima_latest_news.json', incremental: true },
              { id: 'virakesari', module: 'virakesari_selenium_json', data_file: 'virakesari_latest_news.json', incremental: true },
              { id: 'thinakaran', module: 'thinakaran_selenium_json', data_file: 'thinakaran_latest_news.json', incremental: true },
              { id: 'thamilan', module: 'thamilan_selenium_json', data_file: 'thamilan_latest_news.json', incremental: true },
            ];
            const input = context.payload.inputs?.scraper;
            const runAll = context.eventName === 'schedule' || !input || input === 'all';
            const include = runAll ? all : all.filter((x) => x.id === input);
            if (include.length === 0) {
              core.setFailed(`Unknown scraper: ${input}`);
              return;
            }
            core.setOutput('include', JSON.stringify(include));

  scrape:
    name: ${{ matrix.id }}
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.include) }}

    steps:
      - uses: actions/checkout@v4

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            timeTwister/data/${{ matrix.data_file }}
            timeTwister/data/*_checkpoint.json
            timeTwister/data/*_archive.json
          key: scrape-${{ matrix.id }}-${{ runner.os }}
          restore-keys: |
            scrape-${{ matrix.id }}-

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: timeTwister/requirements.txt

      - run: pip install -r timeTwister/requirements.txt

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run incremental scraper (FT.lk-style)
        if: matrix.incremental == true
        working-directory: timeTwister
        env:
          SCRAPE_MODE: incremental
          CI: "true"
        run: |
          if [ "${{ matrix.id }}" = "divaina" ]; then
            xvfb-run -a python scrapers/${{ matrix.module }}.py --incremental
          else
            python scrapers/${{ matrix.module }}.py --incremental
          fi

      - name: Run date-range scraper (xvfb)
        if: matrix.incremental != true
        working-directory: timeTwister
        env:
          CI: "true"
        run: xvfb-run -a python scrapers/${{ matrix.module }}.py

      - name: Show article count
        if: always()
        run: |
          python -c "
          import json, os
          p = 'timeTwister/data/${{ matrix.data_file }}'
          if os.path.isfile(p):
              print('${{ matrix.id }}:', len(json.load(open(p, encoding='utf-8'))), 'articles')
          else:
              print('${{ matrix.id }}: missing', p)
          "

      - name: Stage outlet files for artifact
        if: always()
        run: |
          mkdir -p timeTwister/data artifact-upload/timeTwister/data
          DATA="timeTwister/data/${{ matrix.data_file }}"
          STEM="${{ matrix.data_file }}"
          STEM="${STEM%.json}"
          CP="timeTwister/data/${STEM}_checkpoint.json"
          if [ -f "$DATA" ]; then
            cp "$DATA" artifact-upload/timeTwister/data/
            echo "Packed $DATA ($(wc -c < "$DATA") bytes)"
          else
            echo "No data file at $DATA"
          fi
          if [ -f "$CP" ]; then
            cp "$CP" artifact-upload/timeTwister/data/
          fi
          ls -la artifact-upload/timeTwister/data/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-${{ matrix.id }}
          path: artifact-upload/timeTwister/data/
          retention-days: 7
          if-no-files-found: warn

  commit-data:
    name: Commit merged data
    needs: [prepare-matrix, scrape]
    runs-on: ubuntu-latest
    # Run even when matrix jobs were cancelled (partial artifacts) or failed
    if: always() && needs.prepare-matrix.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
          pattern: data-*
          merge-multiple: true

      - name: Merge artifacts into timeTwister/data
        run: |
          mkdir -p timeTwister/data
          echo "=== Artifact tree ==="
          find artifacts -type f 2>/dev/null | head -80 || echo "(no artifacts dir)"
          # v4 merge-multiple: files may be at artifacts/*.json or nested paths
          find artifacts -type f -name '*.json' 2>/dev/null | while read -r f; do
            base=$(basename "$f")
            cp -f "$f" "timeTwister/data/$base"
            echo "Copied $f -> timeTwister/data/$base"
          done
          echo "=== timeTwister/data after merge ==="
          ls -la timeTwister/data/ || true
          count=$(find timeTwister/data -maxdepth 1 -name '*.json' 2>/dev/null | wc -l)
          echo "JSON files: $count"

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f timeTwister/data/*.json
          git status
          if git diff --cached --quiet; then
            echo "::warning::No data changes to commit. Check matrix logs and artifact merge step."
            exit 0
          fi
          git commit -m "chore: scrape all outlets $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --no-rebase -X ours origin main && git push origin main && break
            echo "Push attempt $i failed, retrying in ${i}s..."
            sleep $i
          done
